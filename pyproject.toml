[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "atlas"
version = "1.0.0"
description = "ATLAS V1 - Nightly Data Pipeline for Investment Management"
authors = ["ATLAS Team"]
readme = "README.md"
packages = [{include = "atlas", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Core
pydantic = "^2.5"
pydantic-settings = "^2.1"
pyyaml = "^6.0"
python-dotenv = "^1.0"

# Data Processing
pandas = "^2.1"
numpy = "^1.26"
pyarrow = "^14.0"
scipy = "^1.11"

# Database
sqlalchemy = "^2.0"
alembic = "^1.13"
pyodbc = "^5.0"
azure-identity = "^1.15"

# Azure Services
azure-functions = "^1.17"
azure-storage-blob = "^12.19"
azure-keyvault-secrets = "^4.7"

# HTTP & API Clients
httpx = "^0.26"
aiohttp = "^3.9"
tenacity = "^8.2"  # Retry logic

# Dashboard
streamlit = "^1.30"
plotly = "^5.18"

# CLI
typer = ">=0.12"
rich = "^13.7"

# Logging & Monitoring
structlog = "^24.1"
opencensus-ext-azure = "^1.1"

# Scheduling
apscheduler = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
pytest-mock = "^3.12"
httpx = "^0.26"
ruff = "^0.1"
mypy = "^1.8"
pre-commit = "^3.6"
testcontainers = "^3.7"

[tool.poetry.scripts]
atlas = "atlas.cli.main:app"

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["atlas"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=atlas --cov-report=term-missing"
